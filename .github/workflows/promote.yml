# Promote a beta release to stable. Run by hand.
# Nothing is rebuilt: the release files stay the same. The release stops being
# a prerelease (so it becomes "latest", which install.sh reads) and
# release/stable moves to its tag.
name: Promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote to stable (for example v0.2.0)"
        required: true
        type: string

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: Promote to stable
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a release tag like v0.2.0, not '${TAG}'." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the release exists
        run: gh release view "${TAG}" --json tagName,isPrerelease
      - name: Move release/stable
        run: scripts/ci/ff-branch.sh "${TAG}" release/stable
      - name: Mark the release as stable
        run: gh release edit "${TAG}" --prerelease=false --latest
      - name: Summary
        run: echo "### Promoted ${TAG} to stable" >> "$GITHUB_STEP_SUMMARY"
