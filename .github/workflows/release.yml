# Runs on every merge to main.
#
# 1. release/develop follows main.
# 2. If the merged commits call for a release, build it for every platform,
#    publish a GitHub prerelease (the beta channel), and move release/beta.
#
# Nothing is committed back to main. The version comes from the git tag, and
# Cargo.toml is edited only inside the build.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move release/develop to main
        run: scripts/ci/ff-branch.sh "${GITHUB_SHA}" release/develop

      - name: Decide the next version
        id: next
        run: |
          version="$(scripts/ci/next-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ -z "${version}" ]]; then
            echo "No release: no feat, fix, perf, or breaking commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Next release: v${version}" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Set the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sed -i.bak -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -m1 '^version' Cargo.toml
      # No --locked: the version edit above changes the lockfile's own entry.
      # Dependency versions stay pinned by Cargo.lock.
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        env:
          TAG: v${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          name="bistro-${TAG}-${TARGET}.tar.gz"
          tar -czf "dist/${name}" -C "target/${TARGET}/release" bistro
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${name}" > "${name}.sha256"; else shasum -a 256 "${name}" > "${name}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish prerelease (beta)
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Create the release
        run: |
          # --target makes GitHub create the tag on this exact commit.
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            --prerelease
      - name: Move release/beta
        run: |
          git fetch --tags --quiet
          scripts/ci/ff-branch.sh "${TAG}" release/beta
      - name: Summary
        run: |
          {
            echo "### Released ${TAG} to beta"
            echo ""
            echo "Promote to stable with the **Promote** workflow, input \`${TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"
